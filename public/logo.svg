<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 820" role="img" aria-label="Code Assurance">
  <defs>
    <!-- Escudo original (verde con </> blanco), con degradé sutil y relieve leve. -->
    <path id="ca-shield" d="M195 30H525A180 155 0 0 0 705 185V430C705 610 545 720 360 790C175 720 15 610 15 430V185A180 155 0 0 0 195 30Z"/>
    <linearGradient id="ca-fill" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#84e4b5"/>
      <stop offset="0.5" stop-color="#67d69e"/>
      <stop offset="1" stop-color="#4cbd85"/>
    </linearGradient>
    <linearGradient id="ca-bevel-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ca-bevel-dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.55" stop-color="#1f6b45" stop-opacity="0"/>
      <stop offset="1" stop-color="#1f6b45" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="ca-clip"><use href="#ca-shield"/></clipPath>
    <filter id="ca-lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#0d3b25" flood-opacity="0.28"/>
    </filter>
    <filter id="ca-emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#145a37" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#ca-lift)">
    <use href="#ca-shield" fill="url(#ca-fill)"/>
  </g>
  <g clip-path="url(#ca-clip)" fill="none">
    <use href="#ca-shield" stroke="url(#ca-bevel-light)" stroke-width="22"/>
    <use href="#ca-shield" stroke="url(#ca-bevel-dark)" stroke-width="22"/>
  </g>

  <g filter="url(#ca-emboss)" fill="none" stroke="#ffffff" stroke-width="27" stroke-linejoin="miter" stroke-miterlimit="4">
    <path d="M281 300 171 395 281 490"/>
    <path d="M439 300 549 395 439 490"/>
    <path d="M409 245 319 548"/>
  </g>
</svg>
